name: Build APK Android

# Compile l'application Android (APK) des vendeurs.
# Lancement : onglet "Actions" du dépôt GitHub -> "Build APK Android" -> "Run workflow"
# (ou en poussant un tag "apk-*"). L'APK est ensuite téléchargeable dans les
# "Artifacts" de l'exécution (rester connecté à GitHub pour y accéder).
on:
  workflow_dispatch:
  push:
    tags: ['apk-*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Capacitor 7 exige Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Compiler le frontend React
        working-directory: frontend
        env:
          CI: 'false' # ne pas transformer les avertissements ESLint en erreurs
        run: |
          npm ci
          npm run build

      - name: Synchroniser Capacitor
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - name: Compiler l'APK (release, signé)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --console=plain --stacktrace 2>&1 | tee ../../gradle.log
          exit "${PIPESTATUS[0]}"

      # En cas d'échec, remonte la fin du journal Gradle dans une annotation
      # (visible sans être connecté, contrairement aux journaux complets).
      - name: Résumé de l'erreur
        if: failure()
        run: |
          MSG=$(grep -n -B2 -A25 -m1 "What went wrong" gradle.log || tail -40 gradle.log)
          MSG="${MSG//'%'/'%25'}"; MSG="${MSG//$'\n'/'%0A'}"; MSG="${MSG//$'\r'/'%0D'}"
          echo "::error title=Erreur Gradle::${MSG:0:3500}"

      - uses: actions/upload-artifact@v4
        with:
          name: boutique-stock-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
